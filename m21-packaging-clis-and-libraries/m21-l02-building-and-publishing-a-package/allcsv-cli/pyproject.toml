[project]
name = "allcsv-cli"
version = "0.1.0"
description = "CLI for allcsvideos.com courses"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Asha" }]
keywords = ["csv", "cli", "courses"]
dependencies = [
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
allcsv = "allcsv_cli.cli:app"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
