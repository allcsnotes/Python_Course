[project]
name = "weekly-report"
version = "0.1.0"
description = "Weekly report bot for allcsvideos"
requires-python = ">=3.14"
dependencies = [
    "fpdf2>=2.8.3",
    "httpx>=0.28.1",
    "matplotlib>=3.10.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3.0",
    "pydantic-settings>=2.10.0",
    "typer>=0.16.0",
    "tzdata>=2025.2",
]

[project.scripts]
weekly-report = "weekly_report.cli:app"

[build-system]
requires = ["uv_build>=0.9.0,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 64

[tool.pytest.ini_options]
pythonpath = ["src"]
