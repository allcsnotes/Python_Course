name: m20l01

x-app: &app
  build: .
  image: m20l01-api
  environment:
    DATABASE_URL: postgresql+psycopg://allcs:allcs@db:5432/allcs
    REDIS_URL: redis://redis:6379/0
    SMTP_HOST: mail
    SMTP_PORT: "1025"
    SECRET_KEY: demo-secret-not-real-1234567890-abcdef
    ACCESS_SECONDS: "36000"
    WEB_CONCURRENCY: "2"
    PROMETHEUS_MULTIPROC_DIR: /tmp/prom
  tmpfs:
    - /tmp/prom:mode=1777

services:
  db:
    image: postgres:17.11
    ports: ["20501:5432"]
    environment:
      POSTGRES_USER: allcs
      POSTGRES_PASSWORD: allcs
      POSTGRES_DB: allcs
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "allcs"]
      interval: 2s
      retries: 20

  redis:
    image: redis:8
    ports: ["20401:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 20

  mail:
    image: axllent/mailpit:v1.32.0

  migrate:
    <<: *app
    command: alembic upgrade head
    depends_on:
      db: {condition: service_healthy}

  api:
    <<: *app
    ports: ["8201:8000"]
    volumes: ["./tools:/tools:ro"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  worker:
    <<: *app
    command: celery -A app.worker worker --concurrency=2
    healthcheck:
      disable: true
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      mail: {condition: service_started}

  prometheus:
    image: prom/prometheus:v3.5.0
    ports: ["20091:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules.yml:/etc/prometheus/rules.yml:ro
    depends_on: [api, worker]

  grafana:
    image: grafana/grafana:12.1.1
    ports: ["20031:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
