name: m20l04

x-app: &app
  image: m20l04-api:${TAG:-base}
  environment: &env
    DATABASE_URL: postgresql+psycopg://allcs:allcs@postgres:5432/allcs
    REDIS_URL: redis://redis:6379/0
    SECRET_KEY: demo-only-not-a-real-secret-4f2a
    WEB_CONCURRENCY: "2"
    POOL_SIZE: ${POOL_SIZE:-5}
    MAX_OVERFLOW: ${MAX_OVERFLOW:-10}
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}

services:
  postgres:
    image: postgres:17.11
    container_name: m20l04-pg
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment: {POSTGRES_USER: allcs, POSTGRES_PASSWORD: allcs, POSTGRES_DB: allcs}
    ports: ["20504:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U allcs"], interval: 2s, timeout: 2s, retries: 15}
  redis:
    image: redis:8
    container_name: m20l04-redis
    ports: ["20404:6379"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 2s, timeout: 2s, retries: 15}
  api:
    <<: *app
    container_name: m20l04-api
    ports: ["8204:8000"]
  worker:
    <<: *app
    container_name: m20l04-worker
    command: ["celery", "-A", "app.worker", "worker", "--loglevel=info", "--concurrency=2"]
