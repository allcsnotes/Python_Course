[project]
name = "allcs"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "fastapi[standard]>=0.162.0",
    "psycopg[binary]>=3.3.6",
    "pyjwt>=2.15.1",
    "sqlalchemy>=2.1.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
