# Runs on the server in /opt/allcs. Two copies of the API (blue and green)
# sit behind Caddy; deploy.sh decides which one gets the traffic.
name: allcs

x-api: &api
  restart: unless-stopped
  stop_grace_period: 30s
  environment:
    ENVIRONMENT: prod
    DATABASE_URL: >-
      postgresql+psycopg://allcs:${POSTGRES_PASSWORD}@postgres:5432/allcs
    REDIS_URL: redis://redis:6379/0
    SECRET_KEY: ${SECRET_KEY}
    WEB_CONCURRENCY: 2
    # only Caddy can reach the API port
    FORWARDED_ALLOW_IPS: "*"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "127.0.0.1:8081:8081"
    volumes:
      - ./caddy:/etc/caddy:ro

  postgres:
    image: postgres:17.11
    restart: unless-stopped
    environment:
      POSTGRES_USER: allcs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: allcs
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U allcs -d allcs"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8
    restart: unless-stopped

  api-blue:
    <<: *api
    image: ${REGISTRY}/allcs:${BLUE_TAG:-unset}
    profiles: ["apps"]

  api-green:
    <<: *api
    image: ${REGISTRY}/allcs:${GREEN_TAG:-unset}
    profiles: ["apps"]

  migrate:
    <<: *api
    restart: "no"
    image: ${REGISTRY}/allcs:${MIGRATE_TAG:-unset}
    command: ["alembic", "upgrade", "head"]
    profiles: ["tools"]

  seed:
    <<: *api
    restart: "no"
    image: ${REGISTRY}/allcs:${MIGRATE_TAG:-unset}
    command: ["python", "-m", "app.seed"]
    environment:
      ENVIRONMENT: prod
      DATABASE_URL: >-
        postgresql+psycopg://allcs:${POSTGRES_PASSWORD}@postgres:5432/allcs
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-change-me-now}
    profiles: ["tools"]

volumes:
  pgdata:
