name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pyright

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.13", "3.14"]
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: allcs
          POSTGRES_PASSWORD: allcs
          POSTGRES_DB: allcs_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U allcs"
          --health-interval 2s
          --health-retries 20
      redis:
        image: redis:8
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+psycopg://allcs:allcs@localhost:5432/allcs_test
      REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q --cov --cov-fail-under=90

  image:
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t allcs:${{ github.sha }} .

  deploy:
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "deploy ${{ github.sha }} to production"
