# Step 2 of the video: only the three services. Postgres, Redis and mailpit run as normal users, never root.
# Save it as compose.yml in your project folder to repeat step 2.
name: m23b16

services:
  postgres:
    image: postgres:17
    user: postgres
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: copilot
    ports: ["23536:5432"]
  redis:
    image: redis:8
    user: redis
    ports: ["23436:6379"]
  mailpit:
    image: axllent/mailpit:v1.32.0
    user: "1000:1000"
    ports: ["23525:1025", "23526:8025"]
