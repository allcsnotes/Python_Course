name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run pyright

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: copilot
          POSTGRES_DB: copilot_test
        ports: ["23538:5432"]
        options: >-
          --health-cmd "pg_isready -U copilot"
          --health-interval 2s
          --health-retries 20
      redis:
        image: redis:8
        ports: ["23438:6379"]
    env:
      TEST_DATABASE_URL: postgresql+psycopg://copilot:copilot@localhost:23538/copilot_test
      TEST_REDIS_URL: redis://localhost:23438/15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run pytest -q --cov --cov-fail-under=90

  image:
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t copilot:ci .
