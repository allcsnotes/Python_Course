name: tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: >-
          uv run pytest -q --cov=cart --cov-branch
          --cov-report=term-missing --cov-fail-under=100
